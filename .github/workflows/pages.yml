name: Deploy viewer to GitHub Pages

# Publishes extras/TelemetryViewer as the site root:
# https://alfredosystems.github.io/AlfredoTelemetry/
on:
  push:
    branches: [main]
    paths:
      - "extras/TelemetryViewer/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: extras/TelemetryViewer
      - id: deployment
        uses: actions/deploy-pages@v4
